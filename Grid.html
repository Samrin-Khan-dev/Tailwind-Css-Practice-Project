<!DOCTYPE html>

<html>
    <head>
       <title> Grid with tailwind css</title>
        <link rel="stylesheet" href="output.css">
    </head>

      <div class="grid grid-cols-4 gap-1 bg-red-400 sm:grid-rows-3">

        <div class="bg-yellow-500 p-14 gap-2">7</div>
        <div class="bg-yellow-600 p-14 gap-2">8</div>
