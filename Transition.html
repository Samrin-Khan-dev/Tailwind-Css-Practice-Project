<!DOCTYPE html>
<html>
    <head>
       <title> Transition with tailwind css</title>
        <link rel="stylesheet" href="output.css">
    </head>
    <body>
       <button class="bg-blue-500 p-3 m-3 transition duration-1000 rounded text-white hover:bg-red-500">button1</button>
<button class="bg-yellow-500 p-3 m-3  rounded text-white hover:opacity-50 transition duration-1000">button1</button>
<button class="bg-green-500 p-3 m-3 rounded text-white hover:rotate-360 transition duration-3000">button1</button>
<button class="bg-blue-500 p-3 m-3 rounded text-white hover:scale-x-200 transition duration-3000">button1</button>
<img src="pic.jpg" class="transition transform hover:scale-50 duration-1000">
    </body>
</html>
