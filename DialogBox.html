<!DOCTYPE html>
<html>
    <head>
        <title>Dialog box in tailwind css</title>
        <link rel="stylesheet" href="output.css">
    </head>
    <body>
      <div>
        <h1 class="text-xl font-bold hover:text-pink-500 cursor-pointer">City Name</h1>
      </div>
      <div class="size-30 hidden group-hover:block bg-blue-400">
            <ul>
                <li>New York</li> 
                <li>San Francisco</li>

                <li>Chicago</li>
            </ul>
      </div>
    </body>
</html>
