<!DOCTYPE html>
<html>
    <head>
       <title>font family size in tailwind css</title>
        <link rel="stylesheet" href="output.css">
    </head>
    <body>
      <p class="font-serif" >hello</p> 
      <p class="font-stretch-50%" >hello2</p> 
      <p class="font-black" >hello3</p> 
      <p class="text-9xl">hello1</p>
      <p class="text-8xl">hello2</p>
      <p class="text-7xl">hello3</p>
      <p class="text-6xl">hello4</p>
      <p class="text-5xl">hello5</p>
      <p class="text-4xl">hello6</p>
      <p class="text-3xl">hello7</p>
      <p class="text-2xl">hello8</p>
      <p class="text-1xl">hello9</p>
    </body>
</html>
